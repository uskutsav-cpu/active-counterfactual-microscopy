name: Research engine checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-research.txt

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-research.txt
          python -m pip install -e .

      - name: Ruff
        run: python -m ruff check src/counterfactual_microscopy/research tests/research

      - name: Research tests
        run: python -m pytest tests/research --cov=counterfactual_microscopy.research --cov-report=term-missing --junitxml=research-tests.xml

      - name: Core regression tests
        run: python -m pytest tests/test_benchmark.py tests/test_hardware.py tests/test_posterior.py tests/test_utility.py tests/test_verdicts.py

      - name: Smoke experiment
        if: matrix.python-version == '3.12'
        run: python -m counterfactual_microscopy.research smoke --out results/research/ci-smoke

      - name: Verify smoke experiment
        if: matrix.python-version == '3.12'
        run: python -m counterfactual_microscopy.research verify-run --run results/research/ci-smoke
