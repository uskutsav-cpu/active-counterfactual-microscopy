name: Research engine checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create isolated environment
        run: |
          python -m venv .ci-venv
          .ci-venv/bin/python -m pip install --upgrade pip setuptools wheel

      - name: Install research dependencies
        run: |
          .ci-venv/bin/python -m pip install --no-cache-dir -r requirements-research.txt
          .ci-venv/bin/python -m pip install --no-cache-dir -e .

      - name: Verify scientific stack
        run: |
          .ci-venv/bin/python - <<'PY'
          import sys
          import numpy
          import scipy
          import scipy.stats
          import sklearn

          print("python:", sys.version)
          print("python executable:", sys.executable)
          print("numpy:", numpy.__version__)
          print("numpy file:", numpy.__file__)
          print("scipy:", scipy.__version__)
          print("scipy file:", scipy.__file__)
          print("sklearn:", sklearn.__version__)
          print("scipy.stats import: OK")
          PY

      - name: Ruff
        run: |
          .ci-venv/bin/python -m ruff check \
            src/counterfactual_microscopy/research \
            tests/research

      - name: Research tests
        run: |
          .ci-venv/bin/python -m pytest \
            --disable-plugin-autoload \
            --assert=plain \
            tests/research \
            --junitxml=research-tests.xml

      - name: Core regression tests
        run: |
          .ci-venv/bin/python -m pytest \
            --disable-plugin-autoload \
            --assert=plain \
            tests/test_benchmark.py \
            tests/test_hardware.py \
            tests/test_posterior.py \
            tests/test_utility.py \
            tests/test_verdicts.py

      - name: Smoke experiment
        if: matrix.python-version == '3.12'
        run: |
          .ci-venv/bin/python -m counterfactual_microscopy.research \
            smoke \
            --out results/research/ci-smoke

      - name: Verify smoke experiment
        if: matrix.python-version == '3.12'
        run: |
          .ci-venv/bin/python -m counterfactual_microscopy.research \
            verify-run \
            --run results/research/ci-smoke
